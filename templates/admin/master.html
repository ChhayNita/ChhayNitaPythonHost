<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | SV7 Store</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f6ff',
              100: '#e0edff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Custom Admin Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="h-full antialiased overflow-x-hidden selection:bg-blue-500 selection:text-white">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm pointer-events-none"></div>

  <div class="min-h-screen flex">

    <!-- Sidebar Navigation Menu Include -->
    {% include 'admin/share/menu.html' %}

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">

      <!-- Header Include -->
      {% include 'admin/share/header.html' %}

      <!-- Main Page Content Block -->
      <main class="p-6 space-y-6 flex-1">
        {% block content %}{% endblock %}
      </main>

    </div>
  </div>

  <!-- Shared Modals Block -->
  {% block modals %}
  <!-- Modal: Add New Product -->
  <div id="modal-add-product" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl p-6 relative space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Add New Product</h3>
        <button onclick="closeModal('modal-add-product')" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <form id="form-add-product" onsubmit="handleAddProductSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">Product Title</label>
          <input type="text" id="new-prod-title" required placeholder="e.g. Wireless Gaming Headset" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Price ($)</label>
            <input type="number" step="0.01" id="new-prod-price" required placeholder="99.99" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Category</label>
            <select id="new-prod-category" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none">
              <option value="electronics">Electronics</option>
              <option value="jewelery">Jewelery</option>
              <option value="men's clothing">Men's Clothing</option>
              <option value="women's clothing">Women's Clothing</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">Image URL</label>
          <input type="url" id="new-prod-image" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeModal('modal-add-product')" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-500">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add New User -->
  <div id="modal-add-user" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-6 relative space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Add New System User</h3>
        <button onclick="closeModal('modal-add-user')" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <form id="form-add-user" onsubmit="handleAddUserSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">Full Name</label>
          <input type="text" id="new-user-name" required placeholder="John Doe" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">Email Address</label>
          <input type="email" id="new-user-email" required placeholder="user@domain.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Role</label>
            <select id="new-user-role" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none">
              <option value="Customer">Customer</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Status</label>
            <select id="new-user-status" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeModal('modal-add-user')" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-500">Create User</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Edit Product -->
  <div id="modal-edit-product" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl p-6 relative space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Edit Product Details</h3>
        <button onclick="closeModal('modal-edit-product')" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <form id="form-edit-product" onsubmit="handleEditProductSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">Product Title</label>
          <input type="text" id="edit-prod-title" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Price ($)</label>
            <input type="number" step="0.01" id="edit-prod-price" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Category</label>
            <select id="edit-prod-category" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none">
              <option value="electronics">Electronics</option>
              <option value="jewelery">Jewelery</option>
              <option value="men's clothing">Men's Clothing</option>
              <option value="women's clothing">Women's Clothing</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">Image URL</label>
          <input type="url" id="edit-prod-image" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeModal('modal-edit-product')" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-500">Update Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Edit User -->
  <div id="modal-edit-user" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-6 relative space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Edit User Account</h3>
        <button onclick="closeModal('modal-edit-user')" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <form id="form-edit-user" onsubmit="handleEditUserSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">Full Name</label>
          <input type="text" id="edit-user-name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">Email Address</label>
          <input type="email" id="edit-user-email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">Role</label>
            <select id="edit-user-role" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none">
              <option value="Customer">Customer</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Status</label>
            <select id="edit-user-status" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeModal('modal-edit-user')" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-500">Update User</button>
        </div>
      </form>
    </div>
  </div>
  {% endblock %}

  <!-- Custom Admin Script -->
  <script src="{{ url_for('static', filename='admin/admin.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
